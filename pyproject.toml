[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-gravity-simulation"
dynamic = ["version"]
description = "A simple 2D Python simulation of gravitational interactions."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Morpheus"},
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "pygame",
    "pymunk",
    "platformdirs",
]

[project.urls]
"Source" = "https://github.com/TheGittyPerson/simple-gravity-simulator"
"Bug Reports" = "https://github.com/TheGittyPerson/simple-gravity-simulator/issues"

[project.scripts]
gravity-sim = "gravity_sim.__main__:main"

[tool.setuptools]
packages = ["gravity_sim"]

[tool.setuptools.dynamic]
version = { attr = "gravity_sim.__version__" }
