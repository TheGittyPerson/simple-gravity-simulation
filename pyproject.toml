[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "template"
dynamic = ["version"]
description = "This is a Python app template repo for me to use."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [ { name = "Morpheus" } ]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [

]

[project.urls]
"Source" = "https://github.com/TheGittyPerson/template-repo"
"Bug Reports" = "https://github.com/TheGittyPerson/template-repo/issues"

[project.scripts]
template = "template.__main__:main"

[tool.setuptools]
packages = ["template"]

#[tool.setuptools.package-data]
#template = ["assets/*", "assets/**/*"]

[tool.setuptools.dynamic]
version = { attr = "template.__version__" }
